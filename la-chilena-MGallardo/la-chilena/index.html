<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>La Chilena</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Mrs+Saint+Delafield&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div id="app-header"></div>

<section class="hero">
  <div class="hero-copy">
    <span class="eyebrow-tag">Despacho gratis · radio de 3&nbsp;km</span>
    <h2>Empanadas de siempre, pedidas como hoy.</h2>
    <p>Recetas de campo, horneadas o fritas al momento. Arma tu pedido online y te las llevamos a la puerta.</p>
    <div class="hero-actions">
      <button class="btn btn-primary" onclick="document.getElementById('catRow').scrollIntoView({behavior:'smooth'})">Ver el menú</button>
    </div>
  </div>
  <div class="hero-photo">
    <img src="assets/img/hero.jpg" alt="Empanadas de pino recién horneadas sobre una tabla de madera">
  </div>
</section>

<main class="page">
  <div class="section-head">
    <div>
      <h2>Menú</h2>
      <p>Elige tus favoritas y arma tu pedido.</p>
    </div>
  </div>

  <div class="cat-row" id="catRow"></div>
  <div class="grid" id="productGrid"></div>
</main>

<footer class="site-footer">
  La Chilena · Empanadas artesanales<br>
  <a href="ayuda.html" class="footer-link">Centro de Ayuda y Manuales</a>
</footer>
<div id="app-tabbar"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>
<script>
renderHeader('menu');

let activeCat = 'todas';
const CATS = [
  {id:'todas', label:'Todas'},
  {id:'horno', label:'Empanadas de horno'},
  {id:'frita', label:'Empanadas fritas'},
  {id:'bebida', label:'Bebidas'},
];

function renderCats(){
  const row = document.getElementById('catRow');
  row.innerHTML = CATS.map(c => `<button class="cat-chip ${c.id===activeCat?'active':''}" data-cat="${c.id}">${c.label}</button>`).join('');
  row.querySelectorAll('.cat-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeCat = btn.dataset.cat; renderCats(); renderProducts(); });
  });
}

function renderProducts(){
  const grid = document.getElementById('productGrid');
  const list = DB.products.filter(p => activeCat==='todas' || p.cat===activeCat);
  grid.innerHTML = list.map(p => `
    <div class="card">
      <div class="card-top">
        <h3>${p.name}</h3>
        <span class="price">${fmtCLP(p.price)}</span>
      </div>
      <p class="desc">${p.desc}</p>
      <div class="card-foot">
        <span class="stock-tag ${p.stock?'':'out'}">${p.stock?'Disponible':'Agotado'}</span>
        <button class="add-btn" ${p.stock?'':'disabled'} data-add="${p.id}">Agregar</button>
      </div>
    </div>
  `).join('');
  grid.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', ()=> addToCart(btn.dataset.add));
  });
}

function addToCart(id){
  const session = getSession();
  if(!session || session.role !== 'cliente'){
    showToast('Inicia sesión como cliente para comprar');
    setTimeout(()=> location.href = 'login.html?next=index.html', 700);
    return;
  }
  const cart = loadOrSeed(cartKey(session.id), {});
  cart[id] = (cart[id]||0) + 1;
  save(cartKey(session.id), cart);
  renderHeader('menu');
  const p = DB.products.find(x=>x.id===id);
  showToast(`${p.name} agregada al carrito`);
}

renderCats();
renderProducts();
</script>
</body>
</html>
