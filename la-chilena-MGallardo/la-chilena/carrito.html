<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi carrito — La Chilena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Mrs+Saint+Delafield&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div id="app-header"></div>

<main class="page">
  <div class="section-head">
    <div>
      <h2>Mi carrito</h2>
      <p>Revisa tu pedido antes de confirmar.</p>
    </div>
  </div>

  <div id="cartEmpty" class="empty-state" hidden>
    <div class="glyph">🛒</div>
    <p>Tu carrito está vacío por ahora.</p>
    <a href="index.html" class="btn btn-primary">Ir al menú</a>
  </div>

  <div class="cart-layout" id="cartLayout">
    <div class="cart-list" id="cartList"></div>

    <div class="summary">
      <h3>Resumen del pedido</h3>
      <div id="summaryLines"></div>
      <div class="sum-row"><span>Despacho</span><span>Gratis</span></div>
      <div class="sum-row total"><span>Total</span><span id="cartTotal">$0</span></div>

      <h3 style="margin-top:6px;">Método de pago</h3>
      <label class="pay-option selected" data-pay="servipag">
        <input type="radio" name="pay" checked>
        <span><strong>Servipag</strong><small>Pago en línea mediante Servipag</small></span>
      </label>
      <label class="pay-option" data-pay="deposito">
        <input type="radio" name="pay">
        <span><strong>Depósito bancario</strong><small>Transferencia a la cuenta del local</small></span>
      </label>

      <button class="btn btn-primary btn-block" onclick="confirmOrder()">Confirmar pedido</button>
    </div>
  </div>
</main>

<footer class="site-footer">
  La Chilena · Empanadas artesanales<br>
  <a href="ayuda.html" class="footer-link">Centro de Ayuda y Manuales</a>
</footer>
<div id="app-tabbar"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>
<script>
const session = requireRole(['cliente']);
if(!session) throw new Error('Redirigiendo a inicio de sesión…');
renderHeader('cart');

let cart = loadOrSeed(cartKey(session.id), {});
let selectedPay = 'servipag';

function changeQty(id, delta){
  cart[id] = (cart[id]||0) + delta;
  if(cart[id] <= 0) delete cart[id];
  save(cartKey(session.id), cart);
  renderHeader('cart');
  renderCart();
}

function renderCart(){
  const entries = Object.entries(cart);
  const empty = document.getElementById('cartEmpty');
  const layout = document.getElementById('cartLayout');
  if(entries.length===0){ empty.hidden = false; layout.style.display = 'none'; return; }
  empty.hidden = true; layout.style.display = 'grid';

  const list = document.getElementById('cartList');
  list.innerHTML = entries.map(([id,qty])=>{
    const p = DB.products.find(x=>x.id===id);
    return `
      <div class="cart-item">
        <div class="thumb">🥟</div>
        <div class="info"><h4>${p.name}</h4><span>${fmtCLP(p.price)} c/u</span></div>
        <div class="stepper">
          <button data-dec="${id}">−</button><span>${qty}</span><button data-inc="${id}">+</button>
        </div>
        <div class="item-total">${fmtCLP(p.price*qty)}</div>
      </div>`;
  }).join('');
  list.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click', ()=>changeQty(b.dataset.inc, 1)));
  list.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click', ()=>changeQty(b.dataset.dec, -1)));

  const total = entries.reduce((sum,[id,qty])=>{
    const p = DB.products.find(x=>x.id===id);
    return sum + (p? p.price*qty : 0);
  },0);
  document.getElementById('summaryLines').innerHTML = entries.map(([id,qty])=>{
    const p = DB.products.find(x=>x.id===id);
    return `<div class="sum-row"><span>${p.name} x${qty}</span><span>${fmtCLP(p.price*qty)}</span></div>`;
  }).join('');
  document.getElementById('cartTotal').textContent = fmtCLP(total);
}

document.querySelectorAll('.pay-option').forEach(opt=>{
  opt.addEventListener('click', ()=>{
    document.querySelectorAll('.pay-option').forEach(o=>{o.classList.remove('selected'); o.querySelector('input').checked=false;});
    opt.classList.add('selected');
    opt.querySelector('input').checked = true;
    selectedPay = opt.dataset.pay;
  });
});

function confirmOrder(){
  const entries = Object.entries(cart);
  if(entries.length===0) return;
  const items = entries.map(([id,qty])=>{
    const p = DB.products.find(x=>x.id===id);
    return {id:p.id, name:p.name, price:p.price, qty};
  });
  const order = {
    id: genOrderId(),
    clientId: session.id,
    date: new Date().toISOString(),
    items,
    pay: selectedPay,
    status: 'pendiente_pago', 
  };
  DB.orders.unshift(order);
  DB.saveOrders();

  cart = {};
  save(cartKey(session.id), cart);
  renderHeader('cart');
  showToast('Pedido confirmado. Te avisaremos cuando salga a despacho.');
  setTimeout(()=> location.href = 'mis-pedidos.html', 700);
}

renderCart();
</script>
</body>
</html>
