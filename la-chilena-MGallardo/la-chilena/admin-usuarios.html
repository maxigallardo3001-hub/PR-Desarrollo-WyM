<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios — Administración La Chilena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Mrs+Saint+Delafield&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div id="app-header"></div>

<main class="page" style="max-width: 1000px; margin: 40px auto; padding: 0 20px;">
  <div class="section-head">
    <div>
      <h2 style="font-family: 'Work Sans', sans-serif; font-weight: 700; font-size: 24px;">
        <i class="fas fa-users-cog" style="color: #B93E35;"></i> Usuarios del sistema
      </h2>
      <p>Asigna el perfil de cada colaborador</p>
    </div>
  </div>


  <div class="win-toolbar">
    <button class="win-btn win-btn-primary" onclick="document.getElementById('modal-usuario').style.display='flex'">
        <i class="fas fa-plus"></i> Nuevo Usuario
    </button>
  </div>


  <div style="overflow-x: auto; background: white; border: 1px solid #d1d5db; border-top: none;">
    <table class="win-datagrid">
      <thead><tr><th>Nombre</th><th>Correo</th><th>Perfil</th><th>Acciones</th></tr></thead>
      <tbody id="usersBody"></tbody>
    </table>
  </div>
</main>


<div id="modal-usuario" class="win-modal-overlay">
  <div class="win-modal">
    <div class="win-modal-header">
      <span><i class="fas fa-user-plus"></i> Agregar usuario</span>
      <button type="button" class="win-modal-close" onclick="document.getElementById('modal-usuario').style.display='none'"><i class="fas fa-times"></i></button>
    </div>
    <div class="win-modal-body">
  
      <form id="newUserForm">
        <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px;">Nombre</label>
        <input type="text" id="nuName" style="width: 100%; border: 1px solid #ccc; padding: 6px; margin-bottom: 12px; border-radius: 3px;" required>
        
        <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px;">Correo</label>
        <input type="email" id="nuEmail" style="width: 100%; border: 1px solid #ccc; padding: 6px; margin-bottom: 12px; border-radius: 3px;" required>
        
        <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px;">Perfil</label>
        <select id="nuRole" style="width: 100%; border: 1px solid #ccc; padding: 6px; margin-bottom: 12px; border-radius: 3px;" required>
          <option value="administrador">Administrador</option>
          <option value="cajero">Cajero virtual</option>
          <option value="despacho">Encargado de despacho</option>
          <option value="dueno">Dueño</option>
        </select>

        <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px;">Contraseña inicial</label>
        <input type="text" id="nuPass" value="lachilena123" style="width: 100%; border: 1px solid #ccc; padding: 6px; border-radius: 3px;" required>
        
        <button type="submit" style="display: none;"></button>
      </form>
    </div>
    <div class="win-modal-footer">
      <button type="button" class="win-btn" onclick="document.getElementById('modal-usuario').style.display='none'">Cancelar</button>
      <button type="button" class="win-btn win-btn-primary" onclick="document.getElementById('newUserForm').requestSubmit()">Crear usuario</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  La Chilena · Empanadas artesanales<br>
  <a href="ayuda.html" class="footer-link">Centro de Ayuda y Manuales</a>
</footer>
<div id="app-tabbar"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>
<script>
const session = requireRole(['administrador']);
if(!session) throw new Error('Redirigiendo a inicio de sesión…');
renderHeader('usuarios');

function renderUsers(){
  const body = document.getElementById('usersBody');
  body.innerHTML = DB.users.map(u => `
    <tr>
      <td>${u.name}</td>
      <td>${u.email}</td>
      <td><span class="role-tag">${ROLE_LABEL[u.role]}</span></td>
      <td>${u.id==='u1' ? '' : `<button class="win-btn" data-del="${u.id}"><i class="fas fa-trash" style="color:#B93E35;"></i> Eliminar</button>`}</td>
    </tr>
  `).join('');
  body.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      DB.users = DB.users.filter(u=>u.id!==btn.dataset.del);
      DB.saveUsers();
      renderUsers();
      showToast('Usuario eliminado.');
    });
  });
}

document.getElementById('newUserForm').addEventListener('submit', function(e){
  e.preventDefault();
  const email = document.getElementById('nuEmail').value.trim();
  if(DB.users.some(u=>u.email.toLowerCase()===email.toLowerCase())){
    showToast('Ya existe un usuario con ese correo.');
    return;
  }
  DB.users.push({
    id:'u'+Date.now(),
    name: document.getElementById('nuName').value.trim(),
    email, role: document.getElementById('nuRole').value,
    pass: document.getElementById('nuPass').value,
  });
  DB.saveUsers();
  this.reset();
  document.getElementById('nuPass').value = 'lachilena123';
  renderUsers();
  

  document.getElementById('modal-usuario').style.display='none';
  showToast('Usuario creado.');
});

renderUsers();
</script>
</body>
</html>
