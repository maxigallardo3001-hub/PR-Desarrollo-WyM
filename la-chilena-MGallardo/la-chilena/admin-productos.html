<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos — Administración La Chilena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Mrs+Saint+Delafield&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div id="app-header"></div>

<main class="page" style="max-width: 1000px; margin: 40px auto; padding: 0 20px;">
  <div class="section-head">
    <div>
      <h2 style="font-family: 'Work Sans', sans-serif; font-weight: 700; font-size: 24px;">
        <i class="fas fa-box-open" style="color: #B93E35;"></i> Productos
      </h2>
      <p>Disponibilidad y precios del menú</p>
    </div>
  </div>


  <div class="win-toolbar">
    <button class="win-btn win-btn-primary" onclick="document.getElementById('modal-producto').style.display='flex'">
        <i class="fas fa-plus"></i> Nuevo Producto
    </button>
    <div style="flex-grow: 1;"></div>
    <input type="search" id="search" placeholder="Buscar producto…" style="padding: 4px 8px; border: 1px solid #ccc; border-radius: 3px; font-size: 13px; min-width: 200px;">
  </div>


  <div style="overflow-x: auto; background: white; border: 1px solid #d1d5db; border-top: none;">
    <table class="win-datagrid">
      <thead>
        <tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Disponible</th><th>Acciones</th></tr>
      </thead>
      <tbody id="productsBody"></tbody>
    </table>
  </div>
</main>


<div id="modal-producto" class="win-modal-overlay">
  <div class="win-modal">
    <div class="win-modal-header">
      <span><i class="fas fa-plus"></i> Agregar producto</span>
      <button type="button" class="win-modal-close" onclick="document.getElementById('modal-producto').style.display='none'"><i class="fas fa-times"></i></button>
    </div>
    <div class="win-modal-body">
      
      <form id="newProductForm">
        <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px;">Nombre</label>
        <input type="text" id="npName" style="width: 100%; border: 1px solid #ccc; padding: 6px; margin-bottom: 12px; border-radius: 3px;" required>
        
        <div style="display: flex; gap: 12px; margin-bottom: 12px;">
          <div style="flex: 1;">
            <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px;">Categoría</label>
            <select id="npCat" style="width: 100%; border: 1px solid #ccc; padding: 6px; border-radius: 3px;" required>
              <option value="horno">Empanada de horno</option>
              <option value="frita">Empanada frita</option>
              <option value="bebida">Bebida</option>
            </select>
          </div>
          <div style="flex: 1;">
            <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px;">Precio (CLP)</label>
            <input type="number" id="npPrice" min="0" step="50" style="width: 100%; border: 1px solid #ccc; padding: 6px; border-radius: 3px;" required>
          </div>
        </div>

        <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px;">Descripción</label>
        <input type="text" id="npDesc" placeholder="Ingredientes / preparación" style="width: 100%; border: 1px solid #ccc; padding: 6px; border-radius: 3px;">
        
        <button type="submit" style="display: none;"></button>
      </form>
    </div>
    <div class="win-modal-footer">
      <button type="button" class="win-btn" onclick="document.getElementById('modal-producto').style.display='none'">Cancelar</button>
      <button type="button" class="win-btn win-btn-primary" onclick="document.getElementById('newProductForm').requestSubmit()">Agregar al menú</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  La Chilena · Empanadas artesanales<br>
  <a href="ayuda.html" class="footer-link">Centro de Ayuda y Manuales</a>
</footer>
<div id="app-tabbar"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>
<script>
const session = requireRole(['administrador','dueno']);
if(!session) throw new Error('Redirigiendo a inicio de sesión…');
renderHeader('productos');

const CAT_LABEL = {horno:'Horno', frita:'Frita', bebida:'Bebida'};

function renderProducts(filter){
  const body = document.getElementById('productsBody');
  const q = (filter||'').toLowerCase();
  const list = DB.products.filter(p => p.name.toLowerCase().includes(q));
  body.innerHTML = list.map(p => `
    <tr>
      <td><strong>${p.name}</strong><br><span style="color:var(--ink-soft); font-size:12px;">${p.desc}</span></td>
      <td>${CAT_LABEL[p.cat]||p.cat}</td>
      <td>${fmtCLP(p.price)}</td>
      <td>
        <label class="switch">
          <input type="checkbox" ${p.stock?'checked':''} data-toggle="${p.id}">
          <span class="slider"></span>
        </label>
      </td>
      <td><button class="win-btn" data-del="${p.id}"><i class="fas fa-trash" style="color:#B93E35;"></i> Eliminar</button></td>
    </tr>
  `).join('');

  body.querySelectorAll('[data-toggle]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const p = DB.products.find(x=>x.id===cb.dataset.toggle);
      p.stock = cb.checked;
      DB.saveProducts();
      showToast(`${p.name}: ${p.stock?'disponible':'agotado'}`);
    });
  });
  body.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      DB.products = DB.products.filter(x=>x.id!==btn.dataset.del);
      DB.saveProducts();
      renderProducts(document.getElementById('search').value);
      showToast('Producto eliminado del menú.');
    });
  });
}

document.getElementById('search').addEventListener('input', e => renderProducts(e.target.value));

document.getElementById('newProductForm').addEventListener('submit', function(e){
  e.preventDefault();
  const product = {
    id: 'p' + Date.now(),
    name: document.getElementById('npName').value.trim(),
    cat: document.getElementById('npCat').value,
    price: Number(document.getElementById('npPrice').value),
    desc: document.getElementById('npDesc').value.trim() || 'Sin descripción.',
    stock: true,
  };
  DB.products.push(product);
  DB.saveProducts();
  this.reset();
  renderProducts();
  
  
  document.getElementById('modal-producto').style.display='none';
  showToast('Producto agregado al menú.');
});

renderProducts();
</script>
</body>
</html>
