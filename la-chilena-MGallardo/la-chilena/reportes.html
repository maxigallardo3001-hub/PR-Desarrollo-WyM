<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte de ventas — La Chilena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Mrs+Saint+Delafield&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div id="app-header"></div>

<main class="page" style="max-width: 1000px; margin: 40px auto; padding: 0 20px;">
  <div class="section-head">
    <div>
      <h2 style="font-family: 'Work Sans', sans-serif; font-weight: 700; font-size: 24px;">
        <i class="fas fa-chart-line" style="color: #B93E35;"></i> Reporte de ventas
      </h2>
      <p>Consulta por período</p>
    </div>
  </div>

  <div class="win-toolbar" style="margin-bottom: 20px; border-radius: 4px; border-bottom: 1px solid #d1d5db; align-items: center;">
    <label style="font-size: 13px; font-weight: bold;">Desde:</label>
    <input type="date" id="fromDate" style="padding: 4px 8px; border: 1px solid #ccc; border-radius: 3px; font-size: 13px;">
    
    <label style="font-size: 13px; font-weight: bold; margin-left: 15px;">Hasta:</label>
    <input type="date" id="toDate" style="padding: 4px 8px; border: 1px solid #ccc; border-radius: 3px; font-size: 13px;">
    
    <button class="win-btn win-btn-primary" style="margin-left: 15px;" onclick="renderReport()">
        <i class="fas fa-search"></i> Consultar
    </button>
  </div>

  <div class="kpi-row" id="kpis" style="margin-bottom: 30px;"></div>

  <div class="panel" style="margin-bottom: 30px; border: 1px solid #d1d5db; box-shadow: none;">
    <h3 style="font-family: 'Work Sans', sans-serif; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">Ventas por producto</h3>
    <div id="byProduct"></div>
  </div>

  <div style="overflow-x: auto; background: white; border: 1px solid #d1d5db;">
    <table class="win-datagrid">
      <thead><tr><th>N° pedido</th><th>Fecha</th><th>Cliente</th><th>Estado</th><th>Total</th><th>Acciones</th></tr></thead>
      <tbody id="salesBody"></tbody>
    </table>
  </div>
</main>

<footer class="site-footer">
  La Chilena · Empanadas artesanales<br>
  <a href="ayuda.html" class="footer-link">Centro de Ayuda y Manuales</a>
</footer>
<div id="app-tabbar"></div>

<div id="cancelModal" style="display:none; position:fixed; inset:0; background:rgba(43,27,18,.45); z-index:80; align-items:center; justify-content:center; padding:16px;">
  <div style="background:var(--white); border-radius:14px; padding:22px; max-width:420px; width:100%;">
    <h3 style="margin-bottom:8px;">Anular pedido</h3>
    <p style="font-size:13.5px; color:var(--ink-soft); margin-bottom:12px;">Indica el motivo de la anulación.</p>
    <select id="cancelReason" style="width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; margin-bottom:14px;">
      <option>Solicitud del cliente</option>
      <option>Producto sin stock</option>
      <option>Error en el pedido</option>
      <option>Otro motivo</option>
    </select>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-ghost btn-block" onclick="closeCancelModal()">Volver</button>
      <button class="btn btn-primary btn-block" onclick="submitCancel()">Confirmar anulación</button>
    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>
<script>
const session = requireRole(['administrador','dueno']);
if(!session) throw new Error('Redirigiendo a inicio de sesión…');
renderHeader('reportes');

function clientName(clientId){
  const c = DB.clients.find(x=>x.id===clientId);
  return c ? c.name : 'Cliente';
}

function renderReport(){
  const from = document.getElementById('fromDate').value;
  const to = document.getElementById('toDate').value;

  let orders = DB.orders.filter(o => o.status !== 'anulado');
  if(from) orders = orders.filter(o => o.date.slice(0,10) >= from);
  if(to) orders = orders.filter(o => o.date.slice(0,10) <= to);

  const total = orders.reduce((s,o)=> s + o.items.reduce((a,it)=>a+it.price*it.qty,0), 0);
  const ticketCount = orders.length;
  const avg = ticketCount ? Math.round(total/ticketCount) : 0;

  document.getElementById('kpis').innerHTML = `
    <div class="kpi-card"><span>Ventas totales</span><strong>${fmtCLP(total)}</strong></div>
    <div class="kpi-card"><span>N° de pedidos</span><strong>${ticketCount}</strong></div>
    <div class="kpi-card"><span>Ticket promedio</span><strong>${fmtCLP(avg)}</strong></div>
  `;

  const byProduct = {};
  orders.forEach(o => o.items.forEach(it => { byProduct[it.name] = (byProduct[it.name]||0) + it.price*it.qty; }));
  const maxVal = Math.max(1, ...Object.values(byProduct));
  document.getElementById('byProduct').innerHTML = Object.entries(byProduct)
    .sort((a,b)=>b[1]-a[1])
    .map(([name,val]) => `
      <div class="bar-row">
        <span class="label">${name}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${(val/maxVal*100).toFixed(0)}%"></div></div>
        <span class="val">${fmtCLP(val)}</span>
      </div>`).join('') || '<p style="color:var(--ink-soft); font-size:13.5px;">Sin ventas en el período.</p>';

  document.getElementById('salesBody').innerHTML = orders.map(o => {
    const t = o.items.reduce((a,it)=>a+it.price*it.qty,0);
    const st = STATUS_LABEL[o.status];
    const canCancel = session.role === 'administrador' && (o.status === 'pendiente_pago' || o.status === 'pagado' || o.status === 'en_preparacion' || o.status === 'despachado');
    return `<tr><td>${o.id}</td><td>${fmtDate(o.date)}</td><td>${clientName(o.clientId)}</td>
      <td><span class="badge ${st.cls}">${st.label}</span></td><td>${fmtCLP(t)}</td>
      <td>${canCancel ? `<button class="win-btn" onclick="openCancelModal('${o.id}')">Anular</button>` : ''}</td></tr>`;
  }).join('') || `<tr><td colspan="6" style="color:var(--ink-soft);">Sin resultados.</td></tr>`;
}

let cancelTargetId = null;
function openCancelModal(id){
  cancelTargetId = id;
  document.getElementById('cancelModal').style.display = 'flex';
}
function closeCancelModal(){
  cancelTargetId = null;
  document.getElementById('cancelModal').style.display = 'none';
}
function submitCancel(){
  const order = DB.orders.find(o => o.id === cancelTargetId);
  if(order){
    order.status = 'anulado';
    order.cancelReason = document.getElementById('cancelReason').value;
    order.cancelledBy = session.name;
    DB.saveOrders();
    showToast('Pedido anulado.');
  }
  closeCancelModal();
  renderReport();
}

renderReport();
</script>
</body>
</html>
