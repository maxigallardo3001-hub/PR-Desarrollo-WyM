<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes — Administración La Chilena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Mrs+Saint+Delafield&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div id="app-header"></div>

<main class="page" style="max-width: 1000px; margin: 40px auto; padding: 0 20px;">
  <div class="section-head">
    <div>
      <h2 style="font-family: 'Work Sans', sans-serif; font-weight: 700; font-size: 24px;">
        <i class="fas fa-address-book" style="color: #B93E35;"></i> Clientes
      </h2>
      <p>Registro de clientes</p>
    </div>
  </div>


  <div class="win-toolbar">
    <button class="win-btn win-btn-primary" onclick="document.getElementById('modal-cliente').style.display='flex'">
        <i class="fas fa-plus"></i> Registrar Cliente
    </button>
    <div style="flex-grow: 1;"></div>
    <input type="search" id="search" placeholder="Buscar por nombre, rut o correo…" style="padding: 4px 8px; border: 1px solid #ccc; border-radius: 3px; font-size: 13px; min-width: 250px;">
  </div>


  <div style="overflow-x: auto; background: white; border: 1px solid #d1d5db; border-top: none;">
    <table class="win-datagrid">
      <thead><tr><th>Rut</th><th>Nombre</th><th>Correo</th><th>Comuna</th><th>Teléfono</th></tr></thead>
      <tbody id="clientsBody"></tbody>
    </table>
  </div>
</main>


<div id="modal-cliente" class="win-modal-overlay">
  <div class="win-modal">
    <div class="win-modal-header">
      <span><i class="fas fa-user-plus"></i> Registrar cliente</span>
      <button type="button" class="win-modal-close" onclick="document.getElementById('modal-cliente').style.display='none'"><i class="fas fa-times"></i></button>
    </div>
    <div class="win-modal-body">

      <form id="newClientForm">
        <div style="display: flex; gap: 12px; margin-bottom: 12px;">
          <div style="flex: 1;">
            <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px;">Rut</label>
            <input type="text" id="ncRut" placeholder="12.345.678-9" style="width: 100%; border: 1px solid #ccc; padding: 6px; border-radius: 3px;" required>
          </div>
          <div style="flex: 2;">
            <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px;">Nombre</label>
            <input type="text" id="ncName" style="width: 100%; border: 1px solid #ccc; padding: 6px; border-radius: 3px;" required>
          </div>
        </div>

        <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px;">Correo</label>
        <input type="email" id="ncEmail" style="width: 100%; border: 1px solid #ccc; padding: 6px; margin-bottom: 12px; border-radius: 3px;" required>
        
        <div style="display: flex; gap: 12px; margin-bottom: 12px;">
          <div style="flex: 1;">
            <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px;">Comuna</label>
            <input type="text" id="ncComuna" style="width: 100%; border: 1px solid #ccc; padding: 6px; border-radius: 3px;" required>
          </div>
          <div style="flex: 1;">
            <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px;">Teléfono</label>
            <input type="tel" id="ncPhone" style="width: 100%; border: 1px solid #ccc; padding: 6px; border-radius: 3px;">
          </div>
        </div>

        <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px;">Contraseña inicial</label>
        <input type="text" id="ncPass" value="chilena123" style="width: 100%; border: 1px solid #ccc; padding: 6px; border-radius: 3px;" required>
        
        <button type="submit" style="display: none;"></button>
      </form>
    </div>
    <div class="win-modal-footer">
      <button type="button" class="win-btn" onclick="document.getElementById('modal-cliente').style.display='none'">Cancelar</button>
      <button type="button" class="win-btn win-btn-primary" onclick="document.getElementById('newClientForm').requestSubmit()">Registrar cliente</button>
    </div>
  </div>
</div>

<footer class="site-footer" style="padding-bottom: 40px;">
  La Chilena · Sistema de Gestión y Ventas<br>
  <a href="ayuda.html" style="color: #6b7280; text-decoration: underline; font-size: 14px; margin-top: 10px; display: inline-block; transition: color 0.3s;" onmouseover="this.style.color='#B93E35'" onmouseout="this.style.color='#6b7280'">Centro de Ayuda y Manuales</a>
</footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>
<script>
const session = requireRole(['administrador']);
if(!session) throw new Error('Redirigiendo a inicio de sesión…');
renderHeader('clientes');

function renderClients(filter){
  const q = (filter||'').toLowerCase();
  const body = document.getElementById('clientsBody');
  const list = DB.clients.filter(c =>
    c.name.toLowerCase().includes(q) || c.run.toLowerCase().includes(q) || c.email.toLowerCase().includes(q));
  body.innerHTML = list.map(c => `
    <tr><td>${c.run}</td><td>${c.name}</td><td>${c.email}</td><td>${c.comuna||'—'}</td><td>${c.phone||'—'}</td></tr>
  `).join('') || `<tr><td colspan="5" style="color:var(--ink-soft); text-align: center;">Sin resultados.</td></tr>`;
}
document.getElementById('search').addEventListener('input', e => renderClients(e.target.value));

document.getElementById('newClientForm').addEventListener('submit', function(e){
  e.preventDefault();
  const email = document.getElementById('ncEmail').value.trim();
  if(DB.clients.some(c=>c.email.toLowerCase()===email.toLowerCase())){
    showToast('Ya existe un cliente con ese correo.');
    return;
  }
  DB.clients.push({
    id:'c'+Date.now(),
    run: document.getElementById('ncRut').value.trim(),
    name: document.getElementById('ncName').value.trim(),
    email, comuna: document.getElementById('ncComuna').value.trim(),
    phone: document.getElementById('ncPhone').value.trim(),
    pass: document.getElementById('ncPass').value,
  });
  DB.saveClients();
  this.reset();
  document.getElementById('ncPass').value = 'chilena123';
  renderClients();
  
  document.getElementById('modal-cliente').style.display='none';
  showToast('Cliente registrado.');
});

renderClients();
</script>
</body>
</html>
